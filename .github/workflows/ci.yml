name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, layers, tests
    runs-on: windows-latest   # the app ships on Windows, so it is tested there
    env:
      QT_QPA_PLATFORM: offscreen
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python and dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Layer rules
        run: uv run lint-imports

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Domain coverage at least 90%
        run: uv run coverage report --include="src/ims/domain/*" --fail-under=90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Export locked runtime dependencies
        run: uv export --locked --no-dev --no-hashes --no-emit-project -o requirements-audit.txt
      - name: pip-audit
        run: uvx pip-audit -r requirements-audit.txt --strict
