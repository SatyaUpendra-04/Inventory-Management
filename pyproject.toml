[project]
name = "ims"
version = "0.1.0"
description = "Inventory, airworthiness and operations management for drone and survey equipment"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "platformdirs>=4.14.5",
    "pydantic>=2.14.3",
    "pyside6>=6.12.0",
    "segno>=1.6.6",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
    "tzdata>=2026.6",
]

[project.scripts]
ims = "ims.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ims"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import sorting
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # naming
    "S",             # security (bandit)
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",
    "DTZ",           # timezone-aware datetimes only
    "T20",           # no print()
]
ignore = ["N818"]  # domain exceptions read better without an "Error" suffix (RuleViolation, NotFound)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts, and sample passwords in tests

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["ims"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
qt_api = "pyside6"
markers = [
    "contract: storage adapter contract tests",
    "integration: tests that touch real files or services",
    "ui: tests that create Qt widgets",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ims"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

# ---------------------------------------------------------------- import-linter
# Enforces the layer rules in docs/ARCHITECTURE.md section 2.
[tool.importlinter]
root_package = "ims"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: ui -> application -> ports -> domain"
type = "layers"
layers = ["ims.ui", "ims.application", "ims.ports", "ims.domain"]

[[tool.importlinter.contracts]]
name = "Domain is pure Python (no I/O, UI or storage libraries)"
type = "forbidden"
source_modules = ["ims.domain"]
forbidden_modules = [
    "ims.application", "ims.ports", "ims.adapters", "ims.ui",
    "PySide6", "sqlalchemy", "alembic", "httpx", "msal", "supabase", "structlog",
]

[[tool.importlinter.contracts]]
name = "Only the composition root (ims.main) may import adapters"
type = "forbidden"
source_modules = ["ims.ui", "ims.application", "ims.ports", "ims.domain"]
forbidden_modules = ["ims.adapters"]

[[tool.importlinter.contracts]]
name = "Adapters never reach up into the application or UI"
type = "forbidden"
source_modules = ["ims.adapters"]
forbidden_modules = ["ims.application", "ims.ui", "PySide6"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.4",
]
